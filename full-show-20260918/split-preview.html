<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANLB E1｜四格分割預覽</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d14;color:#eaf2ff;font:16px system-ui;overflow:hidden}header{height:64px;display:flex;align-items:center;gap:12px;padding:10px 20px;white-space:nowrap}button,a{font:inherit;color:inherit;background:#1c293c;border:1px solid #49617c;border-radius:6px;padding:8px 12px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#245b76}#stage{position:absolute;top:64px;bottom:32px;width:100%;overflow:hidden}#canvas{position:absolute;width:3840px;height:2160px;transform-origin:0 0;background:#000}.slot{position:absolute;width:1920px;height:1080px;overflow:hidden;background:#000}iframe{position:absolute;border:0;width:1920px;height:1080px;pointer-events:none}iframe.portrait{width:1080px;height:1920px;transform-origin:0 0;transform:translateX(1920px) rotate(90deg)}footer{position:absolute;bottom:0;height:32px;width:100%;padding:6px 20px;color:#a9bfd0;font-size:13px}.native header,.native footer,.output header,.output footer{display:none}.output #stage{inset:0}.native #stage{inset:0}.native #canvas{left:0;top:0;transform:none!important}#warning{position:fixed;inset:0;z-index:10;background:#101824;display:none;place-content:center;text-align:center;padding:40px;font-size:26px}.native.invalid #warning{display:grid}
</style>
<header><strong>E1 四格預覽</strong><button data-group="0">1 · A／B／C／D</button><button data-group="1">2 · S1–S4</button><button data-group="2">3 · S5／S6／備用</button><button id="full">全螢幕</button><a href="/" target="_blank">全牆控制 ↗</a></header>
<main id="stage"><div id="canvas"></div></main><footer id="status"></footer>
<div id="warning"><div>原生輸出需要 3840×2160 全螢幕、瀏覽器像素比 1。<p id="actual"></p><button id="nativeFull">進入全螢幕</button><p><a href="split-preview.html">返回縮放預覽</a></p></div></div>
<script>
const groups=[['a','b','c','d'],['s1','s2','s3','s4'],['s5','s6','-','-']];
const params=new URLSearchParams(location.search),native=params.get('native')==='1';
let group=Math.max(0,Math.min(2,Number(params.get('group'))||0));
let slots=params.has('slots')?params.get('slots').split(','):groups[group];
const allowed=new Set(groups.flat());
if(slots.length!==4||slots.some(s=>!allowed.has(s)))slots=groups[group];
document.body.classList.toggle('native',native);
document.body.classList.toggle('output',params.get('output')==='1');
function render(){
 document.querySelector('#canvas').replaceChildren();
 slots.forEach((id,i)=>{const box=document.createElement('div');box.className='slot';box.style.left=(i%2)*1920+'px';box.style.top=Math.floor(i/2)*1080+'px';box.dataset.screen=id;
 if(id!=='-'){const f=document.createElement('iframe');f.title=id.toUpperCase();f.src='screens/'+id+'.html';if(id==='s5'||id==='s6')f.className='portrait';box.append(f);}document.querySelector('#canvas').append(box);});
 document.querySelectorAll('[data-group]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.group)===group)));
 resize();
}
function resize(){const area=document.querySelector('#stage'),c=document.querySelector('#canvas'),scale=Math.min(area.clientWidth/3840,area.clientHeight/2160);
 if(!native){c.style.transform=`scale(${scale})`;c.style.left=(area.clientWidth-3840*scale)/2+'px';c.style.top=(area.clientHeight-2160*scale)/2+'px';}
 const invalid=innerWidth!==3840||innerHeight!==2160||devicePixelRatio!==1;
 document.body.classList.toggle('invalid',native&&invalid);
 document.querySelector('#actual').textContent=`目前 ${innerWidth}×${innerHeight}，像素比 ${devicePixelRatio}`;
 document.querySelector('#status').textContent=`縮放預覽 ${Math.round(scale*100)}% · 左上 ${slots[0].toUpperCase()}／右上 ${slots[1].toUpperCase()}／左下 ${slots[2].toUpperCase()}／右下 ${slots[3].toUpperCase()} · 1–3 切組 · S5/S6 已順時針轉 90° · 共用現行播放狀態`;
}
function change(n){group=n;slots=groups[n];const u=new URL(location.href);u.searchParams.set('group',n);u.searchParams.delete('slots');history.replaceState(null,'',u);render();}
document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>change(Number(b.dataset.group)));
async function full(){if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}
document.querySelector('#full').onclick=full;document.querySelector('#nativeFull').onclick=full;
addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key))change(Number(e.key)-1);});addEventListener('resize',resize);render();
</script></html>
